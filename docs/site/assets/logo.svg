<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" role="img" aria-label="AutoTARGET">
  <!-- Reticle mark -->
  <g transform="translate(20, 20)">
    <circle r="13" fill="none" stroke="#e8c170" stroke-width="2"/>
    <line x1="-19" y1="0" x2="-16" y2="0" stroke="#e8c170" stroke-width="2" stroke-linecap="round"/>
    <line x1="16"  y1="0" x2="19"  y2="0" stroke="#e8c170" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-19" x2="0" y2="-16" stroke="#e8c170" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16"  x2="0" y2="19"  stroke="#e8c170" stroke-width="2" stroke-linecap="round"/>
    <circle r="2.4" fill="#e8c170"/>
  </g>

  <!-- Wordmark: Auto (light) + TARGET (heavy) -->
  <text x="50" y="27"
        font-family="'Space Grotesk', Inter, system-ui, sans-serif"
        font-size="22" fill="#ebede9" letter-spacing="-0.01em">
    <tspan font-weight="400" fill="#a8b5b2">Auto</tspan><tspan font-weight="700">TARGET</tspan>
  </text>
</svg>
