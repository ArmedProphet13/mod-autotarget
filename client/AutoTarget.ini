# AutoTarget configuration.
#
# The on/off switch at runtime is the "Enable AutoTarget" checkbox in
# Interface Options > Combat, the /at chat command, or the toggle hotkey below.
# EnabledOnStartup (below) is only the state the DLL begins with each launch.
#
# Edit values below and relaunch the client to apply them.

[general]
# How much of AutoTarget runs:
#   off        - DLL loads and forwards graphics only; installs no hook.
#   diagnostic - frame hook + engine; reads and logs, never sets a target.
#   live       - full targeting, selection hook, and in-game UI.
# Start at 'off' on a new client to confirm it is stable, then 'diagnostic'
# to verify offsets from the log, then 'live'.
Mode = off

# State AutoTarget starts in each launch: true or false. The checkbox, the
# /at command, and the hotkey override this at runtime.
EnabledOnStartup = true

# How often the targeting engine evaluates, in milliseconds (16 - 1000).
TickRateMs = 70

# Log verbosity: error, warn, info, debug
LogLevel = info

[tier1]
# Brawl bubble: anything basically on top of you. Within this tier the closest
# enemy wins regardless of where you are aiming (point-blank angles are noise).
# Keep this small (2-3 yards) - outside it, accuracy alone decides the pick.
RangeYards  = 2.5
ConeDegrees = 360

[tier2]
# Aimed zone: a tight reticle - the cone is what's directly in front of your
# character, NOT the whole hemisphere ahead. Aim source is your character
# orientation (the same field the server uses for "target not in front of
# you"), so in mouselook this tracks your camera tick-for-tick. Keep this
# tight: ConeDegrees = 20 means +/-10 degrees each side - anything wider and
# mobs off to your flank become eligible picks while you sweep the camera.
RangeYards  = 40
ConeDegrees = 30

[behaviour]
# How the soft pick is delivered:
#   action    - "Action Targeting" (default, recommended).
#               * The engine's aim pick is highlighted in the mouseover
#                 slot every frame, giving you a yellow ring + tooltip
#                 on whichever enemy AutoTarget is aiming at.
#               * Cursor mouseover always wins: hovering a unit suppresses
#                 our highlight that frame, so [target=mouseover] macros
#                 (Counterspell, heals on party frames) work normally.
#               * Pressing Tab targets the aim pick (aim-driven swap),
#                 not the native cycle-by-proximity.
#               * Pressing an offensive cast with no active target sets
#                 the aim pick as your target. Plain /cast Fireball works.
#               * Active target is otherwise sacred - tab/click/cast all
#                 set it, AutoTarget never silently overrides it.
#   mouseover - legacy. Drives the mouseover slot unconditionally
#               (no cursor yield). Use only if `action` cannot bind.
#   target    - legacy. Sets your real target directly every tick.
Mechanism = action

# Aggressive re-aim: while in combat the target follows your camera. Set to
# false for pure void-fill (only acquires when you have no valid target).
AggressiveReaim = true

# How strongly the current target resists being displaced by a rival (0.0-1.0).
# Higher = stickier target, less switching.
HysteresisBonus = 0.20

# Keep the soft target alive briefly across line-of-sight dropouts (ms).
SoftTargetGraceMs = 400

# Fine-tune aim if the cone sits off to one side. Degrees added to your facing.
# Leave at 0 - play in mouselook (hold right mouse button) so your character
# faces your view and the cone tracks it directly.
AimOffsetDegrees = 0

# Skip critters. Off by default - the critter guess also catches training
# dummies, and a stray critter soft target is harmless.
IgnoreCritters = false

# SmartUnstick (v0.3.4). When ON, clears the active target slot whenever the
# slot's own GUID is demonstrably unusable - already-dead corpse, despawned,
# more than 40 yd away (WoW cast cap), server-leashed/evading, or 180-degrees
# behind you while a closer enemy is in your aim cone. Dead/despawned always
# clear regardless of this flag - that ships from v0.3.3.
# Turn OFF to revert range/leash/behind handling to v0.3.3 behaviour.
SmartUnstick = true

# Distance in yards beyond which the active target slot is considered out of
# range (and cleared when SmartUnstick is on). 40 is WoW's hard cast cap.
SmartUnstickMaxRangeYards = 40

